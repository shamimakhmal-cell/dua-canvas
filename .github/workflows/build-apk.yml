name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f2)
          fi
          
          if [ -z "$JAVA_VERSION" ] || [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required, but found version $JAVA_VERSION."
            exit 1
          fi
          echo "Java version $JAVA_VERSION confirmed (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH"
            echo "Searching in app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          echo "APK verified successfully at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUN_NUM="${{ github.run_number }}"
          REPO_NAME="${{ github.event.repository.name }}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          
          ASSET_DIR=$(mktemp -d)
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUM}.apk"
          ASSET_PATH="$ASSET_DIR/$ASSET_NAME"
          
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi
          
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset not found at $ASSET_PATH"
            exit 1
          fi
          
          echo "Creating GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            "$ASSET_PATH#$ASSET_NAME" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "This is an automatically generated debug APK.
            - Built by GitHub Actions.
            - Run Number: ${{ github.run_number }}
            - Run Attempt: ${{ github.run_attempt }}
            - Commit SHA: ${{ github.sha }}
            - Intended for testing only (not a Play Store production release).
            - Signed with a temporary debug keystore."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$TAG_NAME" || true
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
            
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            echo "### GitHub Release Published" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK has been published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
            echo "- **Release URL**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Filename**: \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK directly from the release Assets section. The normal Actions artifact 'app-debug-apk' is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "=== Warning: GitHub Release Publishing Failed ==="
            echo "The APK build and Actions artifact upload succeeded, but release publishing encountered an error."
            
            echo "### Build Success / Release Warning" >> $GITHUB_STEP_SUMMARY
            echo "The APK build and Actions artifact upload (**app-debug-apk**) succeeded successfully. However, automatic release publishing failed or was skipped." >> $GITHUB_STEP_SUMMARY
            echo "You can still download the APK from the GitHub Actions workflow run artifacts." >> $GITHUB_STEP_SUMMARY
          fi
